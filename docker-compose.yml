services:
  postgres:
    image: postgres:16-alpine
    container_name: cvforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cvforge_db}
      POSTGRES_USER: ${POSTGRES_USER:-cvforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvforge_password}
    ports:
      - "5432:5432"
    volumes:
      - cvforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvforge} -d ${POSTGRES_DB:-cvforge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cvforge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cvforge_db}
      POSTGRES_USER: ${POSTGRES_USER:-cvforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvforge_password}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo-key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - cvforge_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cvforge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  cvforge_pgdata:
  cvforge_uploads:
