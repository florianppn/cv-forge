spring:
  datasource:
    url: jdbc:h2:mem:cvforge_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  ai:
    openai:
      api-key: test-key
      chat:
        options:
          model: gpt-4o-mini
app:
  upload-dir: target/test-uploads
  rate-limit:
    capacity: 100
    refill-tokens: 100
    refill-duration-minutes: 1
