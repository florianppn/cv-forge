<div class="flex-1 flex flex-col md:flex-row h-[calc(100vh-64px)] overflow-hidden" *ngIf="cvService.currentProfile() as profile">
  <!-- Volet gauche : Outils & Formulaires -->
  <div class="w-full md:w-5/12 lg:w-4/12 h-full shrink-0">
    <app-editor-panel [profile]="profile"></app-editor-panel>
  </div>

  <!-- Volet droit : Aperçu feuille A4 en temps réel -->
  <div class="w-full md:w-7/12 lg:w-8/12 h-full">
    <app-preview-sheet [profile]="profile"></app-preview-sheet>
  </div>
</div>
